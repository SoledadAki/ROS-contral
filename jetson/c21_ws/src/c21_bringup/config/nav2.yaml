# Nav2 for C21: AMCL on a saved map, NavFn global planner, Regulated Pure Pursuit, output -> cmd_vel_nav
# (the c21_safety arbiter still applies the lidar guard, the APP override and the e-stop).
# Behaviour tree: config/c21_nav_to_pose.xml (no Spin/BackUp recoveries).
# Footprint is the CAD outline incl. wheels: x +-0.136, y +-0.125 -> 0.15 square.

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::OmniMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_model_type: likelihood_field
    laser_min_range: 0.20          # car's own returns (gimbal mast) are below 0.14 m
    laser_max_range: 12.0
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    min_particles: 300
    max_particles: 1500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    update_min_d: 0.10
    update_min_a: 0.15
    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 0.5
    set_initial_pose: false        # the gateway sends the remembered / APP-set pose

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""              # set by navigation.launch.py

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3
      movement_time_allowance: 15.0     # the lidar guard may slow the car near obstacles
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      # RPP turns to the goal heading only while within this radius; AMCL jitter of ~5 cm during the
      # in-place turn flipped it in/out of 0.10 m and the car swung back and forth (2026-11-06 test 2)
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
    FollowPath:
      # Regulated Pure Pursuit: forward-only path following, slows on tight curves / near the goal,
      # turns in place when the path heading is far off and to the final heading at the goal
      # (DWB swerved sideways near the goal on the 2026-11-06 ground test).
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.22
      lookahead_dist: 0.45
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.7
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.08
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.6
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 2.0
      allow_reversing: false             # the rear is the lidar's blind side
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15]]"
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # depth: low / overhanging obstacles the lidar plane (9 cm) misses, from c21_depth_obstacles;
        # depth_floor: floor the camera sees, only clears (so removed low obstacles disappear)
        observation_sources: scan depth depth_floor
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.20
          obstacle_max_range: 2.5
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
          max_obstacle_height: 2.0
        depth:
          topic: /c21/depth_obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 2.0
          expected_update_rate: 0.0
        depth_floor:
          topic: /c21/depth_floor
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -0.2
          max_obstacle_height: 2.0
          raytrace_min_range: 0.0
          raytrace_max_range: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.35
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15]]"
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        # depth: low / overhanging obstacles the lidar plane (9 cm) misses, from c21_depth_obstacles;
        # depth_floor: floor the camera sees, only clears (so removed low obstacles disappear)
        observation_sources: scan depth depth_floor
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_min_range: 0.20
          obstacle_max_range: 2.5
          raytrace_min_range: 0.0
          raytrace_max_range: 3.0
          max_obstacle_height: 2.0
        depth:
          topic: /c21/depth_obstacles
          data_type: PointCloud2
          marking: true
          clearing: false
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 2.0
          expected_update_rate: 0.0
        depth_floor:
          topic: /c21/depth_floor
          data_type: PointCloud2
          marking: false
          clearing: true
          min_obstacle_height: -0.2
          max_obstacle_height: 2.0
          raytrace_min_range: 0.0
          raytrace_max_range: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.35
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.3
      use_astar: true
      allow_unknown: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0
